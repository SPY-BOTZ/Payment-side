.box{

box-shadow:0 5px 25px rgba(0,0,0,0.15);

position: relative;
}

.theme-toggle {
position: absolute;
top: 15px;
right: 15px;
background: none;
border: none;
font-size: 20px;
cursor: pointer;
width: auto;
padding: 5px;
margin: 0;
}

.flash-banner {
background: linear-gradient(90deg, #ff416c, #ff4b2b);
color: white;
font-size: 11px;
font-weight: bold;
padding: 7px 10px;
border-radius: 8px;
margin-bottom: 12px;
text-align: center;
animation: glowPulse 1.5s infinite alternate;
}
@keyframes glowPulse {
  0% { opacity: 0.8; box-shadow: 0 0 5px rgba(255,65,108,0.5); }
  100% { opacity: 1; box-shadow: 0 0 15px rgba(255,75,43,0.9); }
}

.countdown-box {
background: #ffebee;

font-size: 12px;
font-weight: bold;

border-radius: 8px;

}

.logo{

}
.title{

.description{

border-radius: 10px;

.payto{
font-size:15px;

}
.name{
font-size:24px;

}
.plans{

}
.plan{
border:2px solid #ddd;

}
.plan:hover{
border-color:#6a00ff;
}
.plan.active{
border-color:#6a00ff;
background:#f2edff;
box-shadow:0 0 10px rgba(106,0,255,0.20);
}
.plan .duration{
font-size:15px;
font-weight:bold;
color:var(--text-color);
}
.plan .price{
font-size:21px;
font-weight:900;

margin-top:3px;
}
.selected{
font-size:13px;

button{
width:100%;

.telegram{

.channel-btn{

.channel{

.request-btn{

<script>
let selectedAmount = 0;
let selectedDuration = "";
let plansData = { "1week": "2 Day", "1month": "1 Weeks", "2month": "1 Month", "3month": "2 Month" };
let upiId = "BHARATPE.9Q0Q0K0Z8Q466572@unitype";
let qrCodeInstance = null;

function toggleTheme(){
  let body = document.body;
  body.classList.toggle("dark-mode");
  let btn = document.getElementById("themeBtn");
  if(body.classList.contains("dark-mode")){ btn.innerText = "☀️"; } else { btn.innerText = "🌙"; }
}

function copyUpiId(){
  navigator.clipboard.writeText(upiId);
  let toast = document.getElementById("toast");
  toast.innerText = "✅ UPI ID Copied to Clipboard!";
  toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 2500);
}

function playClickSound() {
  try {
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
